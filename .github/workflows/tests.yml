name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      LEAF_RUNTIME_DIR: ${{ github.workspace }}/.runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements-cpu.txt
          python -m pip install -r requirements-web.txt
      - name: Verify bundled model hash and portable configuration
        run: python -m scripts.doctor
      - name: Synthetic tests without checkpoints or raw data
        run: python -m unittest discover -s tests -v
      - name: Check committed split metadata only
        run: python -m scripts.prepare_formal_split --metadata-only
